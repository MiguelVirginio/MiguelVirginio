# Save this file to: .github/workflows/snake.yml
# in your your-username/your-username profile repo.
#
# It generates the animated contribution "snake" SVG and pushes it to an
# `output` branch, which the <picture> block in README.md points to.
# Runs once on push, then automatically once a day.

name: generate snake animation

on:
  schedule:
    - cron: "0 0 * * *" # runs once a day
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: generate snake svg
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
